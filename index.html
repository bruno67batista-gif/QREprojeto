<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content='width=device-width, initial-scale=1.0' />
    <link rel="icon" type="image/png" href="/assets/logoQRE.png?v=2" />
    <title>O Quarto Reich Estelar</title>

    <style>
      :root {
        --preto: #000000;
        --amarelo: #c4a400;
        --ciano: #00e1ff;
        --texto: #f1f0e8;
        --azulpastel: #4d587a;
        --branco: #ffffff;
        --vermelho: #fc2819 ;
      }

      * {box-sizing: border-box}

      body{
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background-image:
            src = ("/assets/backgroundmenu.png?v=2");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: var(--texto);
        font-family: Arial, sans-serif;
        overflow-x: hidden;
      }

      .menu {
        width: min(520px, calc(100% - 32px));
        padding: 40px 24px;
        text-align: center;
        transform: translateY(200px);
        
        
      }

      h1{
        border: 5px; 
        border-color: var(--preto);
        margin: 0;
        font-size: 10px;
      }
      
      h2{
        font-size: 10px;
        border: 5px; 
        border-color: var(--preto);
        margin: 0;
      }
      
      h2 span {
        color: var(--ciano);
      }

      p{
        color: var(--branco)
      }

      .modes {
        width: min(380px, 100%);
        display: grid;
        gap: 12px;
        margin: 0 auto;
        
      }

      .mode-button {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        
        width: 100%;
        min-height: 60px;
        padding: 1px 16px;
        
        color: var(--branco);
        text-decoration: none;
        border: 2px solid #3b4358;
        background: #1e385e;
        transition: 0.2s;

        clip-path: polygon(
          0% 0%,
          92% 0%,
          100% 100%,
          8% 100%
        );
      }

      .mode-button:hover {
        border-color: var(--amarelo);
        background: #b57f00;
        color: var(--vermelho);
        transform: translateX(20px) translateY(-4px);
        
      }

      .mode-button strong {
        display:block;
        margin-bottom: 20px;
        text-align: center;
      }

      .mode-button small {
        color: #c7c7c7;
      }
    </style>
  </head>

<body> 
  <main class="menu">

    <div class="modes">
      <a class="mode-button" href="game.html?mode=singular">
        <strong>CLÁSSICO</strong>
        <small>Jogue singleplayer</small>
      </a>

      <a class="mode-button" href="game.html?mode=pesadelo">
        <strong>PESADELO</strong>
        <small>Você permance o mesmo, já os inimigos...</small>
      </a>

      <a class="mode-button" href="game.html?mode=dupla">
        <strong>DUPLA</strong>
        <small>EM BREVE</small>
      </a>
      <a class="mode-button" href="lore.html">
        <strong>LORE</strong>
        <small>O que é Quarto Reich Estelar?</small>
      </a>
    </div>

  </main>
</body>  
</html>
